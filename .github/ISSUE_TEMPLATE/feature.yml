name: Feature
description: Propose a scoped capability or contract change.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or workflow is currently blocked?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What observable evidence would prove the change works?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: Which package, contract, or workflow owns this change?
    validations:
      required: true
