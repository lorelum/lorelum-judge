name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # GitHub's disposable runner restricts user namespaces and ships
      # user-writable files in /usr/local. Mask that tree only inside a private
      # mount namespace; the actual validation runs as the unprivileged runner.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run complete validation with a trusted toolchain
        run: |
          sudo unshare --mount --propagation private /usr/bin/bash -c '
            set -e
            mount -t tmpfs -o mode=0755 tmpfs /usr/local
            exec runuser -u "$1" -- env "PATH=$2" bun run validate
          ' -- "$(id -un)" "$PATH"
